services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: novatel-churn-api:compose
    container_name: novatel-churn-api-compose
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: novatel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api
    restart: unless-stopped
